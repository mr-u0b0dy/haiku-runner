# Hardware-minimal build: synthetic USB PCM feeder instead of a real UAC2
# device, no BLE or AUX. Lets the pipeline and switching logic be exercised
# with nothing but the DK's own USB port - see
# docs-site/content/test-hardware/layout.md, Variant A.
CONFIG_HR_INPUT_BLE=n
CONFIG_HR_INPUT_USB=y
CONFIG_HR_INPUT_USB_UAC2=n
CONFIG_HR_INPUT_USB_MOCK_FEEDER=y
CONFIG_HR_DEFAULT_INPUT_USB=y
