CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_HEAP_MEM_POOL_SIZE=8192

# BLE Audio (LE Audio unicast sink). Inert unless CONFIG_HR_INPUT_BLE
# selects the Bluetooth options these depend on (see Kconfig.inputs).
CONFIG_BT_DEVICE_NAME="Haiku Runner"
# 0x0841 - Audio Sink / Standalone Speaker, so a phone classifies and shows
# this as a speaker rather than a generic BLE peripheral.
CONFIG_BT_DEVICE_APPEARANCE=2113
CONFIG_BT_SMP=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# Persistent bonds. Without these, bonds live in RAM only, which breaks the
# pairing lifecycle a phone expects: a reboot silently invalidates the key the
# phone stored, and Android only sets up LE Audio on a properly bonded device.
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# We pair Just Works (no IO capabilities), so bonds are unauthenticated. With
# this disabled (the default), a peer that forgets us and re-pairs is rejected
# because the old bond still exists, which Android surfaces as "incorrect PIN".
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_UTF8=y
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=n
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=50
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=70
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_ASCS_MAX_ASE_SNK_COUNT=1
CONFIG_BT_ASCS_MAX_ASE_SRC_COUNT=0
CONFIG_BT_ISO_MAX_CHAN=1
CONFIG_BT_AUDIO_CODEC_CFG_MAX_METADATA_SIZE=10
CONFIG_BT_ATT_PREPARE_COUNT=2

# LC3 decode runs in the BT RX thread; it needs a larger stack and FPU.
CONFIG_BT_RX_STACK_SIZE=4096
CONFIG_BT_BUF_EVT_RX_SIZE=255
CONFIG_BT_BUF_ACL_RX_SIZE=255
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_CMD_TX_SIZE=255
